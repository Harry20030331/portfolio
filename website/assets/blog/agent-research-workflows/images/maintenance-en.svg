<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">From Friction to Continuous Maintenance</title>
  <desc id="description">Two connected loops. Runtime repair: run the workflow, spot friction, fix the issue, and run regression checks. Periodic cleanup: review changes, find redundancy, simplify, and run regression checks again. Experience feeds cleanup, and improvements feed back into execution.</desc>
  <defs>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#128b84" stroke-width="1.7" stroke-linejoin="round" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#5d80b7" stroke-width="1.7" stroke-linejoin="round" />
    </marker>
    <style>
      text { font-family:Arial,Helvetica,sans-serif; }
      .title { font-size:32px; font-weight:700; fill:#20353f; }
      .panel-title { font-size:23px; font-weight:700; }
      .node { fill:#fff; stroke:none; }
      .heading { font-size:21px; font-weight:700; fill:#20353f; }
      .detail { font-size:18px; fill:#667b86; }
      .link-label { font-size:17px; font-weight:600; }
      .repair-arrow { fill:none; stroke:#128b84; stroke-width:2.4; marker-end:url(#teal-arrow); }
      .cleanup-arrow { fill:none; stroke:#5d80b7; stroke-width:2.4; marker-end:url(#blue-arrow); }
    </style>
  </defs>
  <rect width="1200" height="610" rx="12" fill="#fafbf9" />
  <text x="40" y="38" fill="#128b84" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700">EXECUTION &amp; MAINTENANCE · TWO LOOPS</text>
  <text x="40" y="90" class="title">From Friction to Continuous Maintenance</text>
  <g id="runtime-repair" transform="translate(20 60)">
    <rect x="20" y="70" width="520" height="430" rx="16" fill="#eaf2f3" />
    <text x="42" y="109" class="panel-title" fill="#128b84">01  Runtime Repair</text>
    <g id="run-workflow">
      <rect x="42" y="135" width="210" height="94" rx="10" class="node" />
      <text x="56" y="161" fill="#128b84" font-size="12" font-weight="700">01</text>
      <text x="56" y="184" class="heading">Run the Workflow</text>
      <text x="56" y="209" class="detail">Skills and tools</text>
    </g>
    <g id="spot-friction">
      <rect x="306" y="135" width="210" height="94" rx="10" class="node" />
      <text x="320" y="161" fill="#128b84" font-size="12" font-weight="700">02</text>
      <text x="320" y="184" class="heading">Spot Friction</text>
      <text x="320" y="209" class="detail">Bugs and misreadings</text>
    </g>
    <g id="fix-issue">
      <rect x="306" y="358" width="210" height="94" rx="10" class="node" />
      <text x="320" y="384" fill="#128b84" font-size="12" font-weight="700">03</text>
      <text x="320" y="407" class="heading">Fix the Issue</text>
      <text x="320" y="432" class="detail">Update code or Skills</text>
    </g>
    <g id="verify-fix">
      <rect x="42" y="358" width="210" height="94" rx="10" class="node" />
      <text x="56" y="384" fill="#128b84" font-size="12" font-weight="700">04</text>
      <text x="56" y="407" class="heading">Verify the Fix</text>
      <text x="56" y="432" class="detail">Run regression checks</text>
    </g>
    <path d="M260 182H296" class="repair-arrow" />
    <path d="M411 237V348" class="repair-arrow" />
    <path d="M298 405H262" class="repair-arrow" />
    <path d="M147 350V239" class="repair-arrow" />
  </g>
  <g id="exchange">
    <path d="M570 335H650" class="repair-arrow" stroke-dasharray="5 5" />
    <text x="610" y="317" class="link-label" fill="#128b84" text-anchor="middle">Experience</text>
    <path d="M650 420H570" class="cleanup-arrow" stroke-dasharray="5 5" />
    <text x="610" y="445" class="link-label" fill="#5d80b7" text-anchor="middle">Feedback</text>
  </g>
  <g id="periodic-cleanup" transform="translate(640 -340)">
    <rect x="20" y="470" width="520" height="430" rx="16" fill="#eaf2f3" />
    <text x="42" y="509" class="panel-title" fill="#5d80b7">02  Periodic Cleanup</text>
    <g id="review-changes">
      <rect x="42" y="535" width="210" height="94" rx="10" class="node" />
      <text x="56" y="561" fill="#5d80b7" font-size="12" font-weight="700">01</text>
      <text x="56" y="584" class="heading">Review Changes</text>
      <text x="56" y="609" class="detail">Fixes and overhead</text>
    </g>
    <g id="find-redundancy">
      <rect x="306" y="535" width="210" height="94" rx="10" class="node" />
      <text x="320" y="561" fill="#5d80b7" font-size="12" font-weight="700">02</text>
      <text x="320" y="584" class="heading">Find Redundancy</text>
      <text x="320" y="609" class="detail">Repeated or stale rules</text>
    </g>
    <g id="simplify">
      <rect x="306" y="758" width="210" height="94" rx="10" class="node" />
      <text x="320" y="784" fill="#5d80b7" font-size="12" font-weight="700">03</text>
      <text x="320" y="807" class="heading">Simplify</text>
      <text x="320" y="832" class="detail">Merge and trim rules</text>
    </g>
    <g id="check-behavior">
      <rect x="42" y="758" width="210" height="94" rx="10" class="node" />
      <text x="56" y="784" fill="#5d80b7" font-size="12" font-weight="700">04</text>
      <text x="56" y="807" class="heading">Verify Changes</text>
      <text x="56" y="832" class="detail">Run regression checks</text>
    </g>
    <path d="M260 582H296" class="cleanup-arrow" />
    <path d="M411 637V748" class="cleanup-arrow" />
    <path d="M298 805H262" class="cleanup-arrow" />
    <path d="M147 750V639" class="cleanup-arrow" />
  </g>
</svg>
