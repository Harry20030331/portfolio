<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="510" viewBox="0 0 1140 510" role="img" aria-labelledby="title desc">
<title id="title">Two paths from an idea to execution on a computer</title>
<desc id="desc">A rough idea, still in the mind, branches into two paths. The operations path uses a keyboard and mouse to provide standardized symbols and actions. The expression path uses speech and an agent to interpret and clarify the goal. Both paths lead to execution on the computer.</desc>
<defs>
<marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#477baa" stroke-width="1.5"/></marker>
<marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#238b82" stroke-width="1.5"/></marker>
</defs>
