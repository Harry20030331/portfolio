<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="60 40 840 380" role="img" aria-labelledby="title desc">
  <title id="title">Community: paths to the next collaboration</title>
  <desc id="desc">A lab within Stanford connects to a team within Anthropic. The solid arrow indicates joining a team; dashed arrows represent exploration within and beyond each organization.</desc>
  <defs>
    <marker id="solid" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#293d54" stroke-width="1.5"/></marker>
    <marker id="dashed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#7289a0" stroke-width="1.4"/></marker>
  </defs>
  <rect width="960" height="500" fill="#fafbfd"/>
  <g font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle" fill="#293d54">
    <rect x="90" y="140" width="300" height="220" rx="24" fill="#eff3f8" stroke="#a4b2c2" stroke-width="1.5"/>
    <rect x="570" y="140" width="300" height="220" rx="24" fill="#eff3f8" stroke="#a4b2c2" stroke-width="1.5"/>
    <text x="240" y="181" font-size="24">Stanford</text>
    <text x="720" y="181" font-size="24">Anthropic</text>
    <rect x="165" y="222" width="150" height="88" rx="17" fill="#ffffff" stroke="#526f8c" stroke-width="2"/>
    <rect x="645" y="222" width="150" height="88" rx="17" fill="#ffffff" stroke="#526f8c" stroke-width="2"/>
    <text x="240" y="275" font-size="25">Lab</text>
    <text x="720" y="275" font-size="25">Team</text>
    <path d="M315 266H643" stroke="#293d54" stroke-width="2.6" fill="none" marker-end="url(#solid)"/>
    <g stroke="#7289a0" stroke-width="1.7" stroke-dasharray="6 6" fill="none" marker-end="url(#dashed)">
      <path d="M160 140L112 60"/>
      <path d="M320 140L363 73"/>
      <path d="M195 310L135 340"/>
      <path d="M282 310L354 340"/>
      <path d="M650 140L608 73"/>
      <path d="M800 140L848 60"/>
      <path d="M680 310L608 340"/>
      <path d="M765 310L825 340"/>
    </g>
    <g font-size="16">
      <path d="M290 391H337" fill="none" stroke="#293d54" stroke-width="2" marker-end="url(#solid)"/>
      <text x="386" y="397">Joining</text>
      <path d="M487 391H534" fill="none" stroke="#7289a0" stroke-width="1.7" stroke-dasharray="6 6" marker-end="url(#dashed)"/>
      <text x="664" y="397">Exploring opportunities</text>
    </g>
  </g>
</svg>
