<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650" role="img" aria-labelledby="title desc">
<title id="title">A sidebar with pinned Leads and project Workers</title>
<desc id="desc">A two-column workspace schematic. On the left, Secretary and the Leads for Version 2 Model Training and Draft Launch Doc are pinned. Model Training and Data Analysis Workers are grouped under Version 2 Model Training. On the right, the selected model-training Lead holds project context and the ongoing discussion. The launch-document Lead has no Workers.</desc>
