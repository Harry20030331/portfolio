      <text x="1368" y="272">Direct use</text>
      <text x="941" y="606" text-anchor="end" id="user-request-label">Discuss · Assign</text>
      <text x="1065" y="606" text-anchor="start" id="user-result-label">Results · Updates</text>
      <text x="244" y="854" text-anchor="end">Read / write</text>
