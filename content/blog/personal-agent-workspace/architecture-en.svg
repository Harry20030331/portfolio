      <path d="M1628 194H1688" stroke-dasharray="7 8" />
    </g>
    <g text-anchor="start" fill="#8195b2" font-size="21">
      <text x="1732" y="157" id="legend-main-label">Main workflow</text>
      <text x="1732" y="201" id="legend-direct-label">Direct access</text>
    </g>
    <rect x="833" y="130" width="334" height="188" rx="24" fill="#fff" stroke="#ccd9ed" stroke-width="2" />
    <text x="1000" y="182" font-size="29" font-weight="600">User &amp; Devices</text>
    <text x="1000" y="234" font-size="24">MacBook · iPhone</text>
    <text x="1000" y="278" font-size="21" fill="#8195b2">Input · Review · Oversight</text>
