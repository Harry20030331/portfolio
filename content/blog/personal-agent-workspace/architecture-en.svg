      <text x="1484" y="671">Wearables</text>
      <text x="1790" y="671">Campus services</text>
    </g>
    <rect x="390" y="889" width="1220" height="562" rx="36" fill="#edf2ff" stroke="#9eb8ee" stroke-width="2.5" />
