<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1530" viewBox="0 0 2000 1530" role="img" aria-labelledby="title desc">
  <title id="title">A Personal Workspace</title>
  <desc id="desc">User-provided October 6 architecture: user devices above, independent iCloud assets at left, external services at right, and Codex below. Codex combines local Secretary, Lead and Worker collaboration on Mac mini with delegated follow-up through Dots. Solid arrows show the main workflow; dashed arrows show direct user access. The role tree shows organization, not a mandatory routing path.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#8195b2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <rect width="2000" height="1530" fill="#f7f9fc" />
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle" fill="#2c4059">
