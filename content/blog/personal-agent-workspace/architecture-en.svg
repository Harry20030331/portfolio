    <rect x="419" y="972" width="793" height="425" rx="23" fill="#fff" />
    <text x="815" y="1013" font-size="29" font-weight="600" id="local-collaboration-label">Local Collaboration</text>
    <text x="815" y="1044" font-size="23" fill="#8195b2" id="execution-host-label">Mac mini</text>
