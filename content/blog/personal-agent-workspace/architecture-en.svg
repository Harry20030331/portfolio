    <path d="M1229 1108H1250V1335H1229" fill="none" stroke="#8195b2" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M1229 1211H1268" fill="none" stroke="#8195b2" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="1291" y="1081" width="285" height="207" rx="22" fill="#edf7f1" stroke="#b8d9cb" stroke-width="1.7" />
    <text x="1433" y="1129" font-size="25" font-weight="600" id="delegated-followup-label">Delegated Follow-up</text>
    <text x="1433" y="1168" font-size="23" fill="#8195b2" id="dots-label">Dots</text>
    <text x="1433" y="1210" font-size="19" fill="#8195b2">Follow up · Notify</text>
    <g fill="#e2edfc" stroke="#b5cff5" stroke-width="1.5">
