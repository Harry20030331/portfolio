    <rect x="38" y="105" width="415" height="186" rx="20" fill="#fff" stroke="#e4ebf5" stroke-width="1.5" />
    <g text-anchor="start">
      <text x="69" y="150" font-size="29" font-weight="600" id="design-goals-label">Design Goals</text>
      <text x="69" y="190" font-size="23">01   Own your assets</text>
      <text x="69" y="231" font-size="23">02   Clear roles, focused context</text>
      <text x="69" y="272" font-size="23">03   Sustained follow-through</text>
    </g>
    <rect x="1600" y="110" width="355" height="120" rx="20" fill="#fff" stroke="#e4ebf5" stroke-width="1.5" />
